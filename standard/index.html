<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10233f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>YUTORU Standard DEMO</title>
  <link rel="stylesheet" href="standard.css">
</head>
<body>
  <div id="role-gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <section class="gate__panel">
      <p class="eyebrow">YUTORU STANDARD</p><h1 id="gate-title">YUTORU Standard</h1>
      <span class="start-badge">Standard DEMO</span>
      <p>利用する権限を選択してください。権限ごとに必要な機能だけを表示します。</p>
      <p class="demo-note">デモデータは、この端末のStandard版専用領域にのみ保存されます。</p>
      <div class="role-grid">
        <button data-role="punch"><b>スタッフ</b><span>出勤・休憩・退勤</span></button>
        <button data-role="manager"><b>オーナー・店長</b><span>スタッフ・勤怠・店舗管理</span></button>
        <button data-role="accounting"><b>給与管理</b><span>給与計算・明細・出力</span></button>
      </div>
    </section>
  </div>
  <header class="app-header no-print">
    <div><b class="logo">YUTORU Standard</b><span class="demo-badge">Standard DEMO</span></div>
    <label>権限<select id="role-switch"><option value="punch">スタッフ</option><option value="manager">オーナー・店長</option><option value="accounting">給与管理</option></select></label>
  </header>
  <nav id="nav" class="nav no-print" aria-label="メインナビゲーション"></nav>
  <div id="connection-status" class="connection-status is-online no-print" role="status" aria-live="polite">オンライン</div>
  <main id="app" class="container"></main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <footer class="no-print">YUTORU Standard DEMO</footer>
  <script src="standard.js"></script>
</body>
</html>
