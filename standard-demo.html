<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10233f">
  <title>YUTORU Standard デモ版</title>
  <link rel="stylesheet" href="standard/standard.css">
</head>
<body>
  <div id="role-gate" class="gate" role="dialog" aria-modal="true" aria-labelledby="gate-title">
    <section class="gate__panel">
      <p class="eyebrow">YUTORU STANDARD</p><h1 id="gate-title">Standard デモ版</h1>
      <p>使う人に必要な機能だけ。3つの権限からデモを開始してください。</p>
      <p class="demo-note">デモ専用機能です。架空データのみを端末内の専用領域に保存します。</p>
      <div class="role-grid">
        <button data-role="punch"><b>打刻専用</b><span>出勤・休憩・退勤</span></button>
        <button data-role="manager"><b>管理者</b><span>スタッフ・勤怠管理</span></button>
        <button data-role="accounting"><b>経理</b><span>給与計算・明細</span></button>
      </div>
    </section>
  </div>
  <header class="app-header no-print"><div><b class="logo">YUTORU</b><span class="demo-badge">Standard デモ版</span></div><label>デモ権限<select id="role-switch"><option value="punch">打刻専用</option><option value="manager">管理者</option><option value="accounting">経理</option></select></label></header>
  <nav id="nav" class="nav no-print" aria-label="メインナビゲーション"></nav>
  <main id="app" class="container"></main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <footer class="no-print">YUTORU Standard 機能確認用デモ — 本番・Light版とは分離されています</footer>
  <script src="standard/standard.js"></script>
</body>
</html>
