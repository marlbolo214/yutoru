<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>YUTORU Standard デモ版</title>
<style>
:root{--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--paper:#fff;--bg:#f1f5f9;--brand:#0f766e;--brand2:#14b8a6;--danger:#dc2626;--blue:#2563eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif}.hidden{display:none!important}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 15px;font-weight:800}.primary{background:var(--brand);color:#fff}.dark{background:var(--ink);color:#fff}.danger{background:var(--danger);color:#fff}.secondary{background:#e2e8f0;color:var(--ink)}.shell{max-width:1100px;margin:auto;padding:16px}.top{position:sticky;top:0;z-index:10;background:#0f172af2;color:#fff;backdrop-filter:blur(12px);padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 12px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:950;letter-spacing:.08em}.brand small{display:block;color:#99f6e4;letter-spacing:.03em}.demo-switch{display:flex;gap:7px;align-items:center}.demo-switch span{font-size:11px;color:#fde68a}.demo-switch select{width:auto;padding:9px;border-radius:10px}.nav{display:flex;gap:8px;overflow:auto;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:65px;z-index:9}.nav button{white-space:nowrap;padding:9px 12px;background:#f1f5f9;color:#334155}.nav button.active{background:#ccfbf1;color:#115e59}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0f172a0a}.hero{background:linear-gradient(135deg,#0f172a,#115e59);color:white}.hero p{color:#ccfbf1}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.metric{padding:13px;border-radius:13px;background:#f8fafc;border:1px solid var(--line)}.metric small{display:block;color:var(--muted);margin-bottom:5px}.metric b{font-size:20px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.pill{display:inline-block;border-radius:999px;padding:5px 9px;background:#ccfbf1;color:#115e59;font-size:12px;font-weight:800}.notice{padding:12px;border-radius:12px;background:#fffbeb;color:#92400e;font-size:13px;line-height:1.6}.muted{color:var(--muted);font-size:13px}.table-wrap{overflow:auto;-webkit-overflow-scrolling:touch}table{width:100%;border-collapse:collapse;white-space:nowrap}th,td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:#475569;background:#f8fafc}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:10px;max-width:100%}.role-card{display:flex;flex-direction:column;gap:8px;text-align:left;padding:22px;border:1px solid #ffffff30;background:#ffffff12;color:white;min-height:140px}.role-card b{font-size:20px}.role-card small{color:#ccfbf1}.punch-clock{text-align:center;font-size:35px;font-weight:900;margin:8px}.punch-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.punch-actions button{min-height:62px;font-size:17px}.salary{font-size:25px;font-weight:950;color:#047857}.gate{position:fixed;inset:0;z-index:100;background:linear-gradient(145deg,#0f172a,#134e4a);display:grid;place-items:center;padding:18px;overflow:auto}.gate-card{max-width:850px;width:100%;background:white;border-radius:24px;padding:28px}.gate h1{margin:8px 0}.gate .grid3 button{background:linear-gradient(140deg,#0f172a,#0f766e);color:white}.gate .grid3 small{color:#ccfbf1}.section-title{margin:0 0 12px}.feature-list{columns:2;line-height:1.9;color:#475569;font-size:14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{padding:8px 10px;font-size:12px}dialog{border:0;border-radius:20px;padding:0;max-width:620px;width:calc(100% - 24px);box-shadow:0 24px 80px #0005}dialog::backdrop{background:#0f172a99}.modal{padding:22px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:12px;color:var(--muted)}.form-grid input,.form-grid select{display:block;width:100%;margin-top:5px}.footer{padding:20px;text-align:center;color:var(--muted)}
@media(max-width:700px){.grid3,.grid{grid-template-columns:1fr}.gate-card{padding:21px 17px}.gate h1{font-size:25px}.top{align-items:flex-start}.demo-switch{flex-direction:column;align-items:flex-end}.nav{top:76px}.shell{padding:10px}.card{padding:15px}.feature-list{columns:1}.form-grid{grid-template-columns:1fr}.hide-mobile{display:none}.role-card{min-height:112px}.punch-actions button{min-height:68px}}
@media print{.top,.nav,.no-print,.footer{display:none!important}body{background:white}.shell{max-width:none}.card{box-shadow:none;break-inside:avoid}.print-title{display:block!important}}
</style>
</head>
<body>
<div id="gate" class="gate"><section class="gate-card"><div class="brand">YUTORU <span class="pill">STANDARD DEMO</span></div><h1>YUTORU Standard デモ版</h1><p>勤怠管理から給与明細まで。<br>役割に合わせた3つの画面をお試しいただけます。</p><div class="notice">これは架空データを使う端末内保存のデモです。実在する個人情報を入力しないでください。</div><div class="grid3" style="margin-top:18px"><button class="role-card" data-start="punch"><b>打刻専用で試す</b><small>店舗スタッフ向け</small></button><button class="role-card" data-start="manager"><b>管理者で試す</b><small>店長・店舗責任者向け</small></button><button class="role-card" data-start="accounting"><b>経理で試す</b><small>オーナー・経理担当者向け</small></button></div></section></div>
<header class="top"><div class="brand">YUTORU<small>Standard デモ版</small></div><div class="demo-switch"><span>デモ専用機能</span><select id="roleSwitch" aria-label="デモ権限を切り替える"><option value="punch">打刻専用</option><option value="manager">管理者</option><option value="accounting">経理</option></select></div></header>
<nav id="nav" class="nav"></nav><main id="app" class="shell"></main><footer class="footer">YUTORU Standard 機能確認用デモ / データはこの端末内にのみ保存されます</footer>
<dialog id="dialog"><div id="modal" class="modal"></div></dialog>
<script>
(()=>{'use strict';
const KEY='yutoru_standard_demo_v1';
const roles={punch:'打刻専用',manager:'管理者',accounting:'経理'};
const access={punch:['punch'],manager:['dashboard','staff','attendance','settings','devices','export'],accounting:['dashboard','attendance','payroll','history','export']};
const initial=()=>({schemaVersion:2,role:null,store:{name:'YUTORU DEMO STORE',plan:'Standard'},staff:[
 {id:'s1',name:'山田 太郎',employment:'正社員',rate:1500,transport:600,other:12000,overtimeRate:null},
 {id:'s2',name:'佐藤 花子',employment:'アルバイト',rate:1300,transport:500,other:3000,overtimeRate:null},
 {id:'s3',name:'鈴木 一郎',employment:'アルバイト',rate:1250,transport:0,other:0,overtimeRate:null},
 {id:'s4',name:'田中 美咲',employment:'アルバイト',rate:1400,transport:null,other:5000,overtimeRate:null},
 {id:'s5',name:'高橋 健',employment:'正社員',rate:1600,transport:600,other:15000,overtimeRate:1.3}],attendance:[
 {id:1,staff:'s1',date:'2026-09-01',start:'09:00',end:'18:00',breakMin:60,transport:null,type:'通常勤務'},
 {id:2,staff:'s2',date:'2026-09-02',start:'09:00',end:'19:30',breakMin:60,transport:800,type:'8時間超・残業・日別交通費'},
 {id:3,staff:'s3',date:'2026-09-03',start:'05:00',end:'13:00',breakMin:45,transport:null,type:'早朝勤務'},
 {id:4,staff:'s4',date:'2026-09-04',start:'18:00',end:'02:00',breakMin:60,transport:700,type:'深夜・日跨ぎ'},
 {id:5,staff:'s5',date:'2026-09-05',start:'22:00',end:'06:00',breakMin:0,transport:null,type:'深夜・休憩なし'},
 {id:6,staff:'s2',date:'2026-09-06',start:'07:00',end:'16:00',breakMin:60,transport:null,type:'早朝・通常交通費'},
 {id:7,staff:'s3',date:'2026-09-07',start:'10:00',end:'18:00',breakMin:0,transport:0,type:'休憩なし・日別交通費0円'}],settings:{overtime:1.25,night:1.25,earlyHourly:200,round:15,closing:31,workStart:'09:00',workEnd:'18:00',earlyStart:'05:00',earlyEnd:'08:00',nightStart:'22:00',nightEnd:'05:00'},devices:{punch:1,manager:0,accounting:0},punches:[],history:[]});
let state=load();function load(){try{let data=JSON.parse(localStorage.getItem(KEY));return data?.schemaVersion===2?data:initial()}catch(e){return initial()}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const yen=n=>Math.round(n).toLocaleString('ja-JP')+'円';const hours=m=>(m/60).toFixed(1)+'h';
function minutes(t){let [h,m]=t.split(':').map(Number);return h*60+m}function detail(a){let start=minutes(a.start),end=minutes(a.end);if(end<=start)end+=1440;let work=Math.max(0,end-start-a.breakMin),ot=Math.max(0,work-480),early=overlap(start,end,300,480),night=overlap(start,end,1320,1740);return{work,ot,early,night}}function overlap(s,e,a,b){return Math.max(0,Math.min(e,b)-Math.max(s,a))}function staffName(id){return state.staff.find(s=>s.id===id)?.name||'削除済み'}
function attendanceTransport(a,s){return a.transport===null||a.transport===undefined?(s.transport??0):a.transport}
function payroll(s){let rows=state.attendance.filter(a=>a.staff===s.id),sum=rows.reduce((x,a)=>{let d=detail(a);x.work+=d.work;x.ot+=d.ot;x.early+=d.early;x.night+=d.night;x.transport+=attendanceTransport(a,s);return x},{work:0,ot:0,early:0,night:0,transport:0});let overtimeRate=s.overtimeRate??state.settings.overtime,base=sum.work/60*s.rate,ot=sum.ot/60*s.rate*(overtimeRate-1),night=sum.night/60*s.rate*(state.settings.night-1),early=sum.early/60*state.settings.earlyHourly,total=base+ot+night+early+sum.transport+s.other;return{...sum,base,otPay:ot,nightPay:night,earlyPay:early,total,days:rows.length,overtimeRate}}
const navs={punch:[['punch','打刻']],manager:[['dashboard','概要'],['staff','スタッフ'],['attendance','勤怠'],['settings','設定'],['devices','端末管理'],['export','出力・保全']],accounting:[['dashboard','概要'],['attendance','勤怠'],['payroll','給与・明細'],['history','給与履歴'],['export','勤怠出力']]};
function setRole(role){state.role=role;save();$('#gate').classList.add('hidden');$('#roleSwitch').value=role;location.hash='#/'+role+'/'+access[role][0];render()}
function route(){let [,requestedRole,page]=(location.hash||'').split('/');let role=state.role;if(!role)return null;if(requestedRole!==role||!access[role].includes(page)){page=access[role][0];history.replaceState(null,'','#/'+role+'/'+page)}return{role,page}}
function render(){let r=route();if(!r)return;$('#roleSwitch').value=r.role;$('#nav').innerHTML=navs[r.role].map(([p,n])=>`<button class="${p===r.page?'active':''}" data-page="${p}">${n}</button>`).join('');$('#app').innerHTML=views[r.page]();bind();}
const views={punch:()=>`<section class="card hero"><div class="row between"><div><span class="pill">打刻専用端末</span><h2>${esc(state.store.name)}</h2></div><div id="clock" class="punch-clock"></div></div><p>給与・管理設定・出力にはアクセスできない専用画面です。</p></section><section class="card"><h3 class="section-title">スタッフを選択</h3><select id="punchStaff">${state.staff.map(s=>`<option value="${s.id}">${esc(s.name)}（${s.employment}）</option>`).join('')}</select><div class="punch-actions" style="margin-top:14px"><button class="primary" data-punch="出勤">出勤</button><button style="background:#d97706;color:white" data-punch="休憩開始">休憩開始</button><button style="background:#2563eb;color:white" data-punch="休憩終了">休憩終了</button><button class="danger" data-punch="退勤">退勤</button></div></section><section class="card"><h3>本日の勤務状況</h3><div id="todayRows">${punchRows()}</div></section>`,
dashboard:()=>{let role=state.role;return`<section class="card hero"><span class="pill">${roles[role]}</span><h2>${role==='manager'?'店舗運営ダッシュボード':'勤怠・給与ダッシュボード'}</h2><p>${role==='manager'?'スタッフと勤怠を管理します。給与額・給与明細は表示されません。':'全スタッフの勤怠と時給制給与を確認できます。'}</p></section><section class="grid3"><div class="metric"><small>登録スタッフ</small><b>${state.staff.length}名</b><div class="muted">登録人数 無制限</div></div><div class="metric"><small>今月の勤怠</small><b>${state.attendance.length}件</b></div><div class="metric"><small>ライセンス</small><b>1店舗</b><div class="muted">Standard</div></div></section>${role==='accounting'?`<section class="card"><h3>給与計算サマリー</h3><div class="grid">${state.staff.map(s=>`<div class="metric"><small>${esc(s.name)} / 時給制</small><b class="salary">${yen(payroll(s).total)}</b></div>`).join('')}</div></section>`:''}`},
staff:()=>`<section class="card"><div class="row between"><div><h2 class="section-title">スタッフ管理</h2><div class="muted">Standardはスタッフ登録人数 無制限</div></div><button class="primary" id="addStaff">スタッフ登録</button></div><div class="table-wrap"><table><thead><tr><th>氏名</th><th>雇用形態</th><th>操作</th></tr></thead><tbody>${state.staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${s.employment}</td><td class="actions"><button class="secondary" data-edit-staff="${s.id}">編集</button><button class="danger" data-delete-staff="${s.id}">削除</button></td></tr>`).join('')}</tbody></table></div></section>`,
attendance:()=>`<section class="card"><div class="row between"><div><h2 class="section-title">月間勤怠</h2><span class="muted">2026年9月 / 実働・残業・早朝・深夜・交通費</span></div>${state.role==='manager'?'<button id="addAttendance" class="primary">勤怠を追加</button>':''}</div><div class="table-wrap"><table><thead><tr><th>日付</th><th>スタッフ</th><th>勤務</th><th>休憩</th><th>実働</th><th>残業</th><th>早朝</th><th>深夜</th><th>交通費</th>${state.role==='manager'?'<th>修正</th>':''}</tr></thead><tbody>${state.attendance.map(a=>{let d=detail(a),s=state.staff.find(x=>x.id===a.staff),fare=attendanceTransport(a,s||{});return`<tr><td>${a.date}<br><small>${a.type}</small></td><td>${esc(staffName(a.staff))}</td><td>${a.start}–${a.end}</td><td>${a.breakMin}分</td><td>${hours(d.work)}</td><td>${hours(d.ot)}</td><td>${hours(d.early)}</td><td>${hours(d.night)}</td><td>${yen(fare)}<br><small>${a.transport===null||a.transport===undefined?'通常交通費':'日別交通費'}</small></td>${state.role==='manager'?`<td class="actions"><button class="secondary" data-edit-att="${a.id}">修正</button><button class="danger" data-delete-att="${a.id}">削除</button></td>`:''}</tr>`}).join('')}</tbody></table></div></section>`,
settings:()=>`<section class="card"><h2>勤務・手当設定</h2><div class="form-grid"><label>勤務開始<input data-setting="workStart" type="time" value="${state.settings.workStart}"></label><label>勤務終了<input data-setting="workEnd" type="time" value="${state.settings.workEnd}"></label><label>早朝時間帯<input data-setting="earlyStart" type="time" value="${state.settings.earlyStart}"></label><label>早朝終了<input data-setting="earlyEnd" type="time" value="${state.settings.earlyEnd}"></label><label>深夜開始<input data-setting="nightStart" type="time" value="${state.settings.nightStart}"></label><label>深夜終了<input data-setting="nightEnd" type="time" value="${state.settings.nightEnd}"></label><label>打刻単位<select data-setting="round"><option value="1">1分</option><option value="15" selected>15分</option><option value="30">30分</option></select></label><label>締め日<input data-setting="closing" type="number" value="${state.settings.closing}"></label></div><p class="notice">給与額を含む経理専用設定は管理者には表示されません。</p></section>`,
devices:()=>`<section class="card"><h2>端末管理</h2><p class="muted">スタッフ登録人数の「無制限」と端末台数制限は別仕様です。</p>${deviceRow('punch','店舗打刻端末',1)}${deviceRow('manager','管理者端末',2)}${deviceRow('accounting','経理端末',1)}</section><section class="card"><h2>ライセンス対象店舗</h2><div class="grid"><div class="metric"><small>店舗名</small><b>${state.store.name}</b></div><div class="metric"><small>プラン</small><b>Standard</b></div><div class="metric"><small>スタッフ</small><b>人数無制限</b></div><div class="metric"><small>ライセンス</small><b>1店舗</b></div><div class="metric"><small>打刻端末</small><b>1台</b></div><div class="metric"><small>管理者 / 経理端末</small><b>2台 / 1台</b></div></div><p class="notice">デモ表示です。本物のライセンス認証・端末認証は行いません。</p></section>`,
payroll:()=>`<section class="card hero"><h2>時給制 給与計算・給与明細</h2><p>基本給与は時給×実働時間。残業・深夜各25%、早朝手当、日別交通費、その他手当を加算する架空の計算例です。</p></section><section class="card"><div class="table-wrap"><table><thead><tr><th>スタッフ</th><th>基本時給</th><th>実働</th><th>残業</th><th>早朝</th><th>深夜</th><th>交通費</th><th>その他</th><th>支給合計</th><th>操作</th></tr></thead><tbody>${state.staff.map(s=>{let p=payroll(s);return`<tr><td>${esc(s.name)}<br><small>${s.employment}・時給制</small></td><td>${yen(s.rate)}</td><td>${hours(p.work)}</td><td>${hours(p.ot)} / ${yen(p.otPay)}</td><td>${hours(p.early)} / ${yen(p.earlyPay)}</td><td>${hours(p.night)} / ${yen(p.nightPay)}</td><td>${yen(p.transport)}</td><td>${yen(s.other)}</td><td class="salary">${yen(p.total)}</td><td class="actions"><button class="secondary" data-pay-setting="${s.id}">給与設定</button><button class="primary" data-payslip="${s.id}">給与明細を見る</button></td></tr>`}).join('')}</tbody></table></div><p class="notice">税金・社会保険等の控除は本デモでは未実装です。法令上の計算結果を示すものではありません。</p></section>`,
history:()=>`<section class="card"><h2>給与履歴</h2>${state.history.length?state.history.map(h=>`<div class="metric"><small>${h.date}</small><b>${esc(h.name)} ${yen(h.total)}</b></div>`).join(''):'<p class="muted">給与明細を表示すると、デモ用の履歴が記録されます。</p>'}</section>`,
export:()=>`<section class="card"><h2>勤怠出力</h2><p>給与情報を含まない勤怠データを出力します。</p><div class="actions"><button class="primary" id="csv">勤怠CSV</button><button class="dark" id="attendancePdf">勤怠PDF / 印刷</button>${state.role==='manager'?'<button class="secondary" id="backup">バックアップ</button><label class="secondary" style="padding:10px;border-radius:12px;font-weight:800">復元<input id="restore" type="file" accept="application/json" hidden></label>':''}</div></section>${state.role==='manager'?`<section class="card"><h2>デモデータ管理</h2><button class="danger" id="reset">デモを初期状態に戻す</button><p class="muted">Standardデモ専用の保存領域だけを初期化します。Lightデモや本番データには影響しません。</p></section>`:''}`};
function deviceRow(k,label,max){let n=state.devices[k];return`<div class="metric row between" style="margin:9px 0"><div><small>${label}</small><b>${n} / ${max}台</b></div><div class="actions"><button class="primary" data-device-add="${k}" ${n>=max?'disabled':''}>端末登録</button><button class="danger" data-device-remove="${k}" ${n<=0?'disabled':''}>端末解除</button></div></div>`}function punchRows(){return state.punches.length?state.punches.slice(-8).reverse().map(p=>`<div class="metric row between"><b>${esc(staffName(p.staff))}</b><span>${p.type} ${p.time}</span></div>`).join(''):'<p class="muted">本日の打刻はまだありません。</p>'}
function bind(){$$('#nav [data-page]').forEach(b=>b.onclick=()=>{location.hash='#/'+state.role+'/'+b.dataset.page});$$('[data-punch]').forEach(b=>b.onclick=()=>{state.punches.push({staff:$('#punchStaff').value,type:b.dataset.punch,time:new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})});save();render()});$('#addStaff')?.addEventListener('click',()=>staffModal());$$('[data-edit-staff]').forEach(b=>b.onclick=()=>staffModal(b.dataset.editStaff));$$('[data-delete-staff]').forEach(b=>b.onclick=()=>{if(confirm('スタッフを削除しますか？')){state.staff=state.staff.filter(s=>s.id!==b.dataset.deleteStaff);save();render()}});$('#addAttendance')?.addEventListener('click',()=>attendanceModal());$$('[data-edit-att]').forEach(b=>b.onclick=()=>attendanceModal(Number(b.dataset.editAtt)));$$('[data-delete-att]').forEach(b=>b.onclick=()=>{state.attendance=state.attendance.filter(a=>a.id!==Number(b.dataset.deleteAtt));save();render()});$$('[data-setting]').forEach(x=>x.onchange=()=>{state.settings[x.dataset.setting]=x.type==='number'||x.tagName==='SELECT'&&/^\d+$/.test(x.value)?Number(x.value):x.value;save()});$$('[data-device-add]').forEach(b=>b.onclick=()=>{state.devices[b.dataset.device]++;save();render()});$$('[data-device-remove]').forEach(b=>b.onclick=()=>{state.devices[b.dataset.device]--;save();render()});$$('[data-pay-setting]').forEach(b=>b.onclick=()=>paySettingModal(b.dataset.paySetting));$$('[data-payslip]').forEach(b=>b.onclick=()=>payslip(b.dataset.payslip));$('#csv')?.addEventListener('click',downloadCsv);$('#attendancePdf')?.addEventListener('click',()=>window.print());$('#backup')?.addEventListener('click',()=>download(JSON.stringify(state,null,2),'YUTORU_Standard_demo_backup.json','application/json'));$('#restore')?.addEventListener('change',restore);$('#reset')?.addEventListener('click',()=>{if(confirm('Standardデモを初期状態に戻します。よろしいですか？')){localStorage.removeItem(KEY);state=initial();location.hash='';location.reload()}})}function $$(s){return [...document.querySelectorAll(s)]}
function staffModal(id){let s=state.staff.find(x=>x.id===id)||{id:'s'+Date.now(),name:'',employment:'アルバイト',rate:1300,transport:null,other:0,overtimeRate:null};openModal(`<h2>${id?'スタッフ編集':'スタッフ登録'}</h2><form id="staffForm" class="form-grid"><label>氏名<input name="name" required value="${esc(s.name)}"></label><label>雇用形態<select name="employment"><option>アルバイト</option><option ${s.employment==='正社員'?'selected':''}>正社員</option></select></label><div class="row"><button class="primary">保存</button><button type="button" class="secondary" data-close>閉じる</button></div></form>`);$('#staffForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);Object.assign(s,{name:f.get('name'),employment:f.get('employment')});if(!id)state.staff.push(s);save();$('#dialog').close();render()};bindClose()}
function attendanceModal(id){let a=state.attendance.find(x=>x.id===id)||{id:Date.now(),staff:state.staff[0]?.id,date:'2026-09-11',start:'09:00',end:'18:00',breakMin:60,transport:null,type:'追加勤務'};openModal(`<h2>勤怠${id?'修正':'追加'}</h2><form id="attForm" class="form-grid"><label>スタッフ<select name="staff">${state.staff.map(s=>`<option value="${s.id}" ${s.id===a.staff?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><label>日付<input name="date" type="date" value="${a.date}"></label><label>出勤<input name="start" type="time" value="${a.start}"></label><label>退勤<input name="end" type="time" value="${a.end}"></label><label>休憩（分）<input name="breakMin" type="number" value="${a.breakMin}"></label><label>日別交通費（空欄は通常交通費）<input name="transport" type="number" min="0" value="${a.transport??''}" placeholder="未設定"></label><div class="row"><button class="primary">保存</button><button type="button" class="secondary" data-close>閉じる</button></div></form>`);$('#attForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),fare=f.get('transport');Object.assign(a,{staff:f.get('staff'),date:f.get('date'),start:f.get('start'),end:f.get('end'),breakMin:Number(f.get('breakMin')),transport:fare===''?null:Number(fare)});if(!id)state.attendance.push(a);save();$('#dialog').close();render()};bindClose()}
function paySettingModal(id){if(state.role!=='accounting')return;let s=state.staff.find(x=>x.id===id);openModal(`<h2>給与設定｜${esc(s.name)}</h2><form id="payForm" class="form-grid"><label>基本時給<input name="rate" type="number" min="0" required value="${s.rate}"></label><label>残業割増率（%）<input name="overtime" type="number" min="0" step="1" value="${Math.round(((s.overtimeRate??state.settings.overtime)-1)*100)}"></label><label>通常交通費（空欄は未設定）<input name="transport" type="number" min="0" value="${s.transport??''}" placeholder="未設定"></label><label>その他手当<input name="other" type="number" min="0" value="${s.other}"></label><div class="row"><button class="primary">保存</button><button type="button" class="secondary" data-close>閉じる</button></div></form>`);$('#payForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),fare=f.get('transport');Object.assign(s,{rate:Number(f.get('rate')),overtimeRate:1+Number(f.get('overtime'))/100,transport:fare===''?null:Number(fare),other:Number(f.get('other'))});save();$('#dialog').close();render()};bindClose()}
function payslip(id){if(state.role!=='accounting')return;let s=state.staff.find(x=>x.id===id),p=payroll(s);state.history.unshift({date:new Date().toISOString().slice(0,10),name:s.name,total:p.total});state.history=state.history.slice(0,15);save();openModal(`<div id="payslip"><div class="row between"><div><div class="brand">YUTORU</div><h2>給与明細書</h2></div><span>対象期間 2026年9月1日〜9月30日</span></div><h3>${esc(s.name)} 様</h3><div class="grid"><div class="metric"><small>基本時給</small><b>${yen(s.rate)}</b></div><div class="metric"><small>実働時間</small><b>${hours(p.work)}</b></div><div class="metric"><small>基本給与（時給×実働）</small><b>${yen(p.base)}</b></div><div class="metric"><small>残業時間 / 残業手当</small><b>${hours(p.ot)} / ${yen(p.otPay)}</b></div><div class="metric"><small>早朝時間 / 早朝手当</small><b>${hours(p.early)} / ${yen(p.earlyPay)}</b></div><div class="metric"><small>深夜時間 / 深夜手当</small><b>${hours(p.night)} / ${yen(p.nightPay)}</b></div><div class="metric"><small>その他手当</small><b>${yen(s.other)}</b></div><div class="metric"><small>交通費</small><b>${yen(p.transport)}</b></div><div class="metric"><small>支給合計</small><b class="salary">${yen(p.total)}</b></div></div><p class="notice">控除項目（税金・社会保険等）は本デモでは未実装です。</p></div><div class="actions no-print"><button class="dark" id="payslipPdf">給与明細PDF / 印刷</button><button class="secondary" data-close>閉じる</button></div>`);$('#payslipPdf').onclick=()=>window.print();bindClose()}
function openModal(html){$('#modal').innerHTML=html;$('#dialog').showModal()}function bindClose(){$$('[data-close]').forEach(b=>b.onclick=()=>$('#dialog').close())}function downloadCsv(){let header='日付,スタッフ名,出勤,退勤,休憩,実働,残業,早朝,深夜,交通費',rows=state.attendance.map(a=>{let d=detail(a),s=state.staff.find(x=>x.id===a.staff);return[a.date,staffName(a.staff),a.start,a.end,a.breakMin,d.work,d.ot,d.early,d.night,attendanceTransport(a,s||{})].join(',')});download('\ufeff'+[header,...rows].join('\n'),'YUTORU_Standard_attendance.csv','text/csv')}function download(data,name,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();URL.revokeObjectURL(a.href)}async function restore(e){try{let parsed=JSON.parse(await e.target.files[0].text());if(parsed.schemaVersion!==2||!parsed.staff||!parsed.attendance||parsed.staff.some(s=>typeof s.rate!=='number'))throw Error();state=parsed;save();render();alert('Standardデモを復元しました')}catch(_){alert('有効な時給制Standardデモのバックアップではありません')}}
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>setRole(b.dataset.start));$('#roleSwitch').onchange=e=>setRole(e.target.value);window.addEventListener('hashchange',render);setInterval(()=>{let c=$('#clock');if(c)c.textContent=new Date().toLocaleString('ja-JP',{month:'long',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);if(state.role){$('#gate').classList.add('hidden');if(!location.hash)setRole(state.role);else render()}
})();
</script>
</body></html>
